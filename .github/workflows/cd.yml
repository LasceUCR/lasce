name: CD

on:
  push:
    branches: [development, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true

# Least privilege at the top; jobs widen only what they need.
permissions:
  contents: read

concurrency:
  # Never cancel a delivery mid-flight: the migration may already be running
  # against a real database.
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  context:
    name: resolve target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
      tag: ${{ steps.pick.outputs.tag }}
      app_url: ${{ steps.pick.outputs.app_url }}
      minio_endpoint: ${{ steps.pick.outputs.minio_endpoint }}
      minio_use_ssl: ${{ steps.pick.outputs.minio_use_ssl }}
      registry: ${{ steps.pick.outputs.registry }}
    steps:
      # These are repo-level variables rather than environment ones because
      # this job runs before the production approval gate.
      - id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          MANUAL: ${{ inputs.environment }}
          URL_STAGING: ${{ vars.APP_URL_STAGING }}
          URL_PRODUCTION: ${{ vars.APP_URL_PRODUCTION }}
          MINIO_STAGING: ${{ vars.MINIO_ENDPOINT_STAGING }}
          MINIO_PRODUCTION: ${{ vars.MINIO_ENDPOINT_PRODUCTION }}
          MINIO_SSL_STAGING: ${{ vars.MINIO_USE_SSL_STAGING }}
          MINIO_SSL_PRODUCTION: ${{ vars.MINIO_USE_SSL_PRODUCTION }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            target="$MANUAL"
          elif [ "$REF_NAME" = "main" ]; then
            target="production"
          else
            target="staging"
          fi

          # Each environment has its own MinIO, so the storage host that
          # next/image may load from is resolved per target like the URL.
          if [ "$target" = "production" ]; then
            url="$URL_PRODUCTION"
            minio="$MINIO_PRODUCTION"
            minio_ssl="$MINIO_SSL_PRODUCTION"
          else
            url="$URL_STAGING"
            minio="$MINIO_STAGING"
            minio_ssl="$MINIO_SSL_STAGING"
          fi

          if [ -z "$url" ]; then
            echo "::error::No APP_URL variable configured for '$target'. Set the"\
                 "repository variable APP_URL_STAGING or APP_URL_PRODUCTION."
            exit 1
          fi

          # This value becomes NEXT_PUBLIC_APP_URL, which app/lib/site.ts feeds
          # to metadataBase and sitemap.ts via new URL(). A bare hostname throws
          # "TypeError: Invalid URL" and fails next build, so reject it here
          # rather than 20 seconds into a Docker build.
          case "$url" in
            https://*|http://*) ;;
            *)
              echo "::error::APP_URL for '$target' must include a scheme."\
                   "Got '$url'; expected something like 'https://$url'."
              exit 1
              ;;
          esac

          # GHCR paths must be lowercase; the organisation is "LasceUCR".
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "environment=$target" >> "$GITHUB_OUTPUT"
          echo "tag=$target" >> "$GITHUB_OUTPUT"
          echo "app_url=$url" >> "$GITHUB_OUTPUT"
          echo "minio_endpoint=$minio" >> "$GITHUB_OUTPUT"
          echo "minio_use_ssl=$minio_ssl" >> "$GITHUB_OUTPUT"
          echo "Target: $target ($url)"

  # Delivery is gated on exactly the same jobs that gate a pull request.
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  images:
    name: image
    needs: [context, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # GITHUB_TOKEN pushes to GHCR, so no PAT in CI.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: infra/docker/web.Dockerfile
          - name: worker
            dockerfile: infra/docker/worker.Dockerfile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.3.0

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_* is inlined at compile time, so the web image is built per
      # target and cannot be promoted between environments. The worker image
      # ignores this arg and is environment-agnostic.
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ needs.context.outputs.app_url }}
            MINIO_ENDPOINT=${{ needs.context.outputs.minio_endpoint }}
            MINIO_USE_SSL=${{ needs.context.outputs.minio_use_ssl }}
          tags: |
            ${{ needs.context.outputs.registry }}/lasce-${{ matrix.name }}:${{ needs.context.outputs.tag }}
            ${{ needs.context.outputs.registry }}/lasce-${{ matrix.name }}:${{ needs.context.outputs.tag }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Coolify, the campus servers and their datastores are reachable only from
  # inside the UCR network, so this job runs on a self-hosted runner there. It
  # needs nothing but curl and jq: it asks Coolify to redeploy the
  # environment's Compose resource (infra/coolify/compose.yml), which pulls the
  # tag pushed above, runs the `migrate` service and only then replaces web and
  # worker. A failed migration fails the Coolify deployment, and this job with it.
  deploy:
    name: deploy
    needs: [context, images]
    runs-on: [self-hosted, lasce-coolify]
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    # `production` has required reviewers, so this job pauses here for approval.
    environment:
      name: ${{ needs.context.outputs.environment }}
      url: ${{ needs.context.outputs.app_url }}
    env:
      # Defined separately in each GitHub Environment, whose branch policy is
      # what keeps the token away from any other branch. The resource UUID alone
      # decides which environment Coolify redeploys.
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_RESOURCE_UUID: ${{ vars.COOLIFY_RESOURCE_UUID }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      APP_URL: ${{ needs.context.outputs.app_url }}
      # Repo-level, shared with cron-jobs.yml. Must equal the CRON_SECRET set on
      # the Coolify resource, or the schedule sync below answers 401.
      CRON_SECRET: ${{ needs.context.outputs.environment == 'production' && secrets.CRON_SECRET_PRODUCTION || secrets.CRON_SECRET_STAGING }}
    steps:
      - name: Check the configuration
        run: |
          for name in COOLIFY_URL COOLIFY_RESOURCE_UUID COOLIFY_TOKEN CRON_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured for '${{ needs.context.outputs.environment }}'."
              exit 1
            fi
          done

      # The images job pushed over the mutable tag, and a Coolify deploy of a
      # Compose resource pulls it again. `force=false` keeps Coolify's own image
      # cache for the datastores.
      - name: Deploy through Coolify
        timeout-minutes: 20
        run: |
          response=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_RESOURCE_UUID&force=false")
          deployment=$(jq -r '.deployments[0].deployment_uuid // empty' <<<"$response")
          if [ -z "$deployment" ]; then
            echo "::error::Coolify did not queue a deployment: $response"
            exit 1
          fi
          echo "Coolify deployment $deployment"

          while true; do
            status=$(curl -sS --fail-with-body \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "$COOLIFY_URL/api/v1/deployments/$deployment" | jq -r '.status')
            echo "status: $status"
            case "$status" in
              finished) exit 0 ;;
              failed|cancelled*)
                echo "::error::Coolify deployment $deployment ended as '$status'."\
                     "Its log is in the Coolify UI; a failed migration shows there."
                exit 1
                ;;
            esac
            sleep 10
          done

      # /api/health is 200 only when both Postgres and Redis answer, and it
      # returns no connection strings.
      - name: Smoke test
        run: |
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "$APP_URL/api/health" || echo 000)
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              cat "$RUNNER_TEMP/health.json"
              exit 0
            fi
            sleep 10
          done
          echo "::error::/api/health never returned 200 after 5 minutes."
          cat "$RUNNER_TEMP/health.json" || true
          exit 1

      # Recurring jobs are declared in packages/jobs/src/schedules.ts and fired
      # by BullMQ's scheduler, which lives in Redis. The deployed Redis is not
      # reachable from here, so the web app syncs it itself: every declared
      # entry is upserted and any that is no longer declared is removed, so it
      # is safe on every deploy. It runs after the smoke test so the worker that
      # consumes them is already up.
      - name: Register job schedules
        run: |
          curl -sS --fail-with-body -X POST "$APP_URL/api/jobs/schedules" \
            -H "Authorization: Bearer $CRON_SECRET"
