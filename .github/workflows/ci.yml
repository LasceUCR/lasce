name: CI

on:
  pull_request:
    branches: [development, main]
  # Called by cd.yml, so every push to development/main is verified by exactly
  # the same jobs that gate a pull request.
  workflow_call:

# Least privilege: CI never needs to write anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Never cancel the CI run that is gating a delivery.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  # turbo.json sets "ui": "tui", which needs a TTY. Force the stream
  # renderer so output is deterministic and never blocks on a runner.
  TURBO_UI: 'false'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      # The worker has its own job, so this stays Node-only and skips uv.
      - run: pnpm turbo run lint --filter='!@lasce/worker'

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      # `typecheck` dependsOn ^build, so `prisma generate` runs first and the
      # gitignored packages/db/generated/ client exists before tsc runs.
      - run: pnpm turbo run typecheck --filter='!@lasce/worker'

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup

      # `test` is the unit suite in every workspace and writes coverage/, the
      # output turbo.json already declares. It starts no browser: Playwright
      # lives behind `test:e2e` and has its own job below. Thresholds are set
      # per workspace in vitest.config.ts, so a drop fails here.
      - run: pnpm turbo run test --filter='!@lasce/worker'

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Coverage'
            echo
            echo '| Workspace | Lines | Statements | Functions | Branches |'
            echo '| --- | ---: | ---: | ---: | ---: |'
          } >> "$GITHUB_STEP_SUMMARY"
          for f in $(find . -path ./node_modules -prune -o -name coverage-summary.json -print); do
            node -e '
              const fs = require("fs")
              const [file] = process.argv.slice(1)
              const total = JSON.parse(fs.readFileSync(file, "utf8")).total
              // ./apps/web/coverage/coverage-summary.json -> apps/web
              const name = file.split("/").slice(1, -2).join("/")
              const pct = (k) => `${total[k].pct}% (${total[k].covered}/${total[k].total})`
              console.log(`| ${name} | ${pct("lines")} | ${pct("statements")} | ${pct("functions")} | ${pct("branches")} |`)
            ' "$f" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: coverage-typescript
          path: |
            apps/*/coverage
            packages/*/coverage
          retention-days: 7

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm turbo run build

  worker:
    name: worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          python: 'true'
      # uv resolves the interpreter from apps/worker/.python-version (3.13).
      - name: ruff
        working-directory: apps/worker
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy
        working-directory: apps/worker
        run: uv run mypy app
      # pyproject.toml's addopts add --cov and --cov-fail-under, so a coverage
      # drop fails this job the same way a failing test does.
      - name: pytest
        working-directory: apps/worker
        run: uv run pytest

      - name: Coverage summary
        if: always()
        working-directory: apps/worker
        shell: bash
        run: |
          {
            echo '### Worker coverage'
            echo
            echo '```'
            uv run coverage report || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: coverage-worker
          path: apps/worker/coverage.xml
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # .env.example points at localhost, so these make that bootstrap real.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lasce
          POSTGRES_PASSWORD: lasce
          POSTGRES_DB: lasce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lasce"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'
      - name: Apply migrations
        run: pnpm db:generate && pnpm db:migrate:deploy
      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      # playwright.config.ts starts `next dev` as its own webServer.
      - run: pnpm --filter @lasce/web test:e2e
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: infra/docker/web.Dockerfile
          - name: worker
            dockerfile: infra/docker/worker.Dockerfile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.3.0
      # Build only, never push; cd.yml publishes. Sharing the GHA cache scope
      # with cd.yml means the publishing build on merge starts warm.
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          build-args: |
            NEXT_PUBLIC_APP_URL=http://localhost:3000
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
