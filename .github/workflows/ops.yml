name: Manual operations

# Syncs packages/jobs/src/schedules.ts into one environment's BullMQ scheduler
# without shipping code, through the same POST /api/jobs/schedules call the
# deploy job in cd.yml makes after every release.
#
# The deployed Redis and Postgres are reachable only from inside the UCR
# network, so nothing here takes a connection URL. Seeding a database is a
# one-off over an SSH tunnel instead; see docs/deployment.md.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to sync
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read

concurrency:
  group: ops-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  register-schedules:
    name: register schedules
    # Staging may be reachable only from the campus network.
    runs-on: [self-hosted, lasce-coolify]
    timeout-minutes: 5
    steps:
      - name: Register job schedules
        env:
          # Repo-level on purpose, like cron-jobs.yml: an idempotent sync should
          # not wait for the production reviewers.
          APP_URL: ${{ inputs.target == 'staging' && vars.APP_URL_STAGING || vars.APP_URL_PRODUCTION }}
          CRON_SECRET: ${{ inputs.target == 'staging' && secrets.CRON_SECRET_STAGING || secrets.CRON_SECRET_PRODUCTION }}
        run: |
          curl -sS --fail-with-body -X POST "$APP_URL/api/jobs/schedules" \
            -H "Authorization: Bearer $CRON_SECRET"
