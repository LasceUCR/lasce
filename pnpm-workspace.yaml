packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks lifecycle scripts unless a dependency is listed here.
# These need theirs: Prisma downloads its query engine, and the rest ship
# platform-specific native binaries.
onlyBuiltDependencies:
  - "@prisma/engines"
  - "@tailwindcss/oxide"
  - esbuild
  - msgpackr-extract
  - prisma
  - sharp
  - unrs-resolver
