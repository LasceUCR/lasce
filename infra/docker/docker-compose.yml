# Local development stack.
#
#   docker compose --env-file .env -f infra/docker/docker-compose.yml up -d
#   (or simply: pnpm services:up)
#
# By default this starts only the datastores — PostgreSQL, Redis, InfluxDB and
# MinIO — because the usual loop is to run `pnpm dev` and `pnpm worker:dev` on the
# host against them. Add `--profile apps` to run the application containers too.

name: lasce

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lasce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lasce}
      POSTGRES_DB: ${POSTGRES_DB:-lasce}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lasce} -d ${POSTGRES_DB:-lasce}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  influxdb:
    image: influxdb:3-core
    restart: unless-stopped
    environment:
      INFLUXDB3_NODE_ID: lasce-node-0
      INFLUXDB3_OBJECT_STORE: file
      INFLUXDB3_DATA_DIR: /var/lib/influxdb3/data
      # Development only. Without this you would have to mint an admin token
      # (`docker compose exec influxdb influxdb3 create token --admin`) and copy
      # it into .env before anything could write. Never do this in production —
      # see infra/docker/README.md.
      INFLUXDB3_WITHOUT_AUTH: "true"
    ports:
      - "8181:8181"
    volumes:
      - influxdb-data:/var/lib/influxdb3/data

  minio:
    image: quay.io/minio/minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-lasce}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-lasce-secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- application containers (opt in with `--profile apps`) -------------------

  web:
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-lasce}:${POSTGRES_PASSWORD:-lasce}@postgres:5432/${POSTGRES_DB:-lasce}
      REDIS_URL: redis://redis:6379
      QUEUE_NAME: ${QUEUE_NAME:-lasce}
      CRON_SECRET: ${CRON_SECRET:-dev-secret-change-me}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-lasce}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-lasce-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-lasce-files}
      MINIO_USE_SSL: "false"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lasce}:${POSTGRES_PASSWORD:-lasce}@postgres:5432/${POSTGRES_DB:-lasce}
      REDIS_URL: redis://redis:6379
      QUEUE_NAME: ${QUEUE_NAME:-lasce}
      INFLUXDB_HOST: http://influxdb:8181
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-local-dev-token}
      INFLUXDB_DATABASE: ${INFLUXDB_DATABASE:-lasce}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-lasce}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-lasce-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-lasce-files}
      MINIO_USE_SSL: "false"
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  influxdb-data:
  minio-data:
